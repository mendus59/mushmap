name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Also run by the data workflow after it publishes new heat map data.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Add heat map data from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            mkdir -p public/data/generated
            # Raw sightings stay on the data branch; the site only needs the grid, models, weather and trails.
            paths="cells.json model"
            if git cat-file -e FETCH_HEAD:weather 2>/dev/null; then paths="$paths weather"; fi
            if git cat-file -e FETCH_HEAD:trails 2>/dev/null; then paths="$paths trails"; fi
            git archive FETCH_HEAD $paths | tar -x -C public/data/generated
          else
            echo "No data branch yet; the heat map will say data is not generated."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
